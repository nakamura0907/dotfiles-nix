name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  check-linux:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix flake check (linux)
        run: nix flake check --system x86_64-linux
      - name: build WSL home configuration
        run: nix build .#homeConfigurations.wsl.activationPackage

  check-macos:
    if: github.event.pull_request.draft == false
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix flake check (macos)
        run: nix flake check --system aarch64-darwin
      - name: build macOS home configuration
        run: nix build .#homeConfigurations.macos.activationPackage
